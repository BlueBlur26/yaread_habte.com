<!-- ========================= Contact Section ========================== -->
<section class="contact-section">

    <div class="contact-container">

        <h1>Let's Connect</h1>

        <p>
            Interested in working together? Send me a message and I'll get back
            to you as soon as possible.
        </p>

<form action="https://formsubmit.co/ea750775b07ac5ed1c75d5a036bc2b56" method="POST">

    <!-- FormSubmit Settings -->
    <input type="hidden" name="_captcha" value="false">

    <input type="hidden"
           name="_subject"
           value="New Portfolio Contact Form Submission">

    <input type="hidden"
           name="_template"
           value="table">

   <input type="hidden"
       name="_next"
       value="http://127.0.0.1:5500/thankyou.html">

    <div class="contact-row">
        <input
            type="text"
            name="name"
            placeholder="Hi! My name is"
            required>

        <input
            type="email"
            name="email"
            placeholder="My Email Address"
            required>
    </div>

    <textarea
        name="message"
        placeholder="I'm looking for..."
        required></textarea>

    <button type="submit">Submit</button>

</form>
</section>
      <!-- Footer -->
      <footer>

      </footer>
      <!-- JavaScript: Hamburger Toggle -->
      <script>
         function toggleMenu() {
           var menu = document.querySelector(".mobile-menu");
           menu.classList.toggle("active");
         }
      </script>
      <!-- JavaScript: Auto Close Mobile Menu on Resize -->
      <script>
         window.addEventListener('resize', function () {
           const menu = document.querySelector('.mobile-menu');
           const hamburger = document.querySelector('.hamburg');
           if (window.innerWidth > 884 && menu.classList.contains('active')) {
             menu.classList.remove('active');
           }
         });
      </script>
   </body>
</html>
